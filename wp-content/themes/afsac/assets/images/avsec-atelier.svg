<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
	<!--
		Catalogue AVSEC — illustration du format « atelier » : table de travail et
		participants autour d'un livrable. Jumelle de avsec-cours.svg, en second
		bleu OACI (damier) et sans aucun texte incrusté.
	-->
	<rect width="480" height="270" fill="#1a6fc0"/>

	<!-- Participants, derrière la table (arc du fond). -->
	<g fill="#00417f">
		<circle cx="90" cy="132" r="13"/>
		<path d="M68 176v-14a22 22 0 0 1 44 0v14z"/>
		<circle cx="165" cy="124" r="13"/>
		<path d="M143 168v-14a22 22 0 0 1 44 0v14z"/>
		<circle cx="240" cy="120" r="13"/>
		<path d="M218 164v-14a22 22 0 0 1 44 0v14z"/>
		<circle cx="315" cy="124" r="13"/>
		<path d="M293 168v-14a22 22 0 0 1 44 0v14z"/>
		<circle cx="390" cy="132" r="13"/>
		<path d="M368 176v-14a22 22 0 0 1 44 0v14z"/>
	</g>

	<!-- Table ronde : le plateau porte le livrable produit pendant l'atelier. -->
	<ellipse cx="240" cy="184" rx="188" ry="48" fill="#00478c"/>
	<ellipse cx="240" cy="178" rx="176" ry="41" fill="#3b82c8" opacity="0.55"/>

	<!-- Documents de travail. -->
	<g fill="#e4eefb" opacity="0.92">
		<rect x="186" y="168" width="38" height="24" rx="2"/>
		<rect x="256" y="168" width="38" height="24" rx="2"/>
	</g>
	<g stroke="#0054a4" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
		<path d="M193 175h24M193 181h18M263 175h24M263 181h18"/>
	</g>
</svg>
